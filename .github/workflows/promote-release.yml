name: Promote release

# The DXMT pre-release becomes a normal release as soon as MacNdCheese Wine has a normal release
# (Macndcheese-org/wine).  Wine releases are in another repository, so this looks for them every hour.
# See .github/mnc/prerelease.sh.
#
# A schedule only runs from the default branch, so this file must be on main.

on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: promote-release
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/mnc

      - name: Promote the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/mnc/prerelease.sh promote
